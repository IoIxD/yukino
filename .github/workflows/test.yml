name: Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # TODO test more variants; we should be regularly testing
    #   - dynamic load / linked variants, for libraries
    #   - maybe others as well; possibly we can force-disable
    #     stuff like avx2 to be able to test MOAR variants

    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          #sudo apt-get install --fix-missing cmake

      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Build'
        run: |
          cd lib
          mkdir build
          cd build
          cmake .. -DYUKINO_TEST=1
          make
          cd ../..

      - name: 'Run test suite'
        run: |
          cd lib/build
          make test
          cd ../..
